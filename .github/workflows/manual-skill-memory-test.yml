name: Skill Memory manual test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-xdist
      - name: Run Skill Memory tests
        env:
          FAST_TEST: "True"
          USE_GPU: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/training/test_skill_memory.py -v
          python examples/skill_memory.py
