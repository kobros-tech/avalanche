name: Skill Memory prototype

# TEMPORARY: development-only workflow. Do not merge upstream.
# This workflow provides a focused signal for the Skill Memory implementation
# without making repository-wide legacy lint/format checks part of the result.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/skill-memory-prototype
    paths:
      - 'avalanche/training/skill_memory/**'
      - 'avalanche/training/plugins/**'
      - 'tests/training/**'
      - 'tests/**'
      - 'examples/skill_memory.py'
      - 'examples/skill_memory_arithmetic.py'
      - 'examples/skill_memory_benchmark.py'
      - 'examples/skill_memory_policy_oracle.py'
      - 'examples/skill_memory_standard_benchmark.py'
      - 'docs/skill_memory_benchmark.md'
      - '.github/workflows/skill-memory.yml'

jobs:
  skill-memory:
    name: Skill Memory tests
    runs-on: ubuntu-latest
    container:
      image: continualai/avalanche-test-3.11:latest
    defaults:
      run:
        shell: bash -l -c "conda run -n avalanche-env --no-capture-output bash {0}"
    steps:
      - uses: actions/checkout@v3
      - name: Run Skill Memory unit tests
        env:
          FAST_TEST: "True"
          USE_GPU: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -n 0 tests/training/test_skill_memory.py -v \
            -k "not test_plugin_runs_inside_real_avalanche_training_loop"
          pytest -n 0 tests/training/test_skill_memory_policy.py -v
          pytest -n 0 tests/training/test_skill_memory_compatibility.py -v
      - name: Run Skill Memory Avalanche integration test
        env:
          FAST_TEST: "True"
          USE_GPU: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -n 0 tests/training/test_skill_memory.py -v \
            -k "test_plugin_runs_inside_real_avalanche_training_loop"
      - name: Run generic Skill Memory example
        env:
          FAST_TEST: "True"
          USE_GPU: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python examples/skill_memory.py
      - name: Run arithmetic proof of concept
        env:
          FAST_TEST: "True"
          USE_GPU: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python examples/skill_memory_arithmetic.py
      - name: Run controlled multi-seed Skill Memory benchmark
        env:
          FAST_TEST: "True"
          USE_GPU: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python examples/skill_memory_benchmark.py
      - name: Run Skill Memory policy oracle comparison
        env:
          FAST_TEST: "True"
          USE_GPU: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python examples/skill_memory_policy_oracle.py
      - name: Run standard RotatedMNIST benchmark (FAST_TEST-sized)
        env:
          FAST_TEST: "True"
          USE_GPU: "False"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python examples/skill_memory_standard_benchmark.py
      - name: Upload multi-seed benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: skill-memory-benchmark-multiseed
          path: results/skill_memory_benchmark_multiseed.json
      - name: Upload policy oracle result
        uses: actions/upload-artifact@v4
        with:
          name: skill-memory-policy-oracle
          path: results/skill_memory_arithmetic_policy_oracle.json
      - name: Upload standard RotatedMNIST result
        uses: actions/upload-artifact@v4
        with:
          name: skill-memory-rotated-mnist
          path: results/skill_memory_rotated_mnist.json
